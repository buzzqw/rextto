[package]
name = "rextto-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal UI client for the Rextto daemon"
license = "EUPL-1.2"
default-run = "rextto-tui"

[[bin]]
name = "rextto-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
ureq = { version = "2", features = ["json"] }
serde_json = "1"

[profile.release]
opt-level = 3
strip = true
