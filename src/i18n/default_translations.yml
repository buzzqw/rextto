  "Rextto mostra i tmpfs/ramfs disponibili. Se non ne hai uno configurato puoi creare /dev/shm/rextto; scegliendo un percorso vengono proposti automaticamente dimensione massima e margine in base allo spazio reale. Il contenuto di /dev/shm non sopravvive al riavvio della macchina.": "Rextto shows available tmpfs/ramfs mounts. If none is configured, you can create /dev/shm/rextto; choosing a path automatically suggests the maximum size and margin based on real free space. /dev/shm contents do not survive a machine reboot."
