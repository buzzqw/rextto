  "Con l'ottimizzazione automatica attiva i campi che mostrano Auto sono di sola lettura: li gestisce Rextto. Disattivandola tornano modificabili: 3/3/5 sono il valore base, che la coda dinamica adatta comunque a runtime (download tra minimo e massimo, seed a 1 quando ci sono download in coda, limite = download + seed + 2).": "When automatic optimisation is enabled, fields showing Auto are read-only: Rextto manages them. When disabled, they become editable again: 3/3/5 are the baseline, which the dynamic queue still adjusts at runtime (downloads between minimum and maximum, seeds at 1 when downloads are queued, limit = downloads + seeds + 2)."
