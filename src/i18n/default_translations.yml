  "Individua i file video chiaramente inferiori (risoluzione più bassa) rimasti accanto alla versione migliore. Il controllo usa il nome del file e i dati tecnici dichiarati nel nome, non confronta il contenuto né calcola hash. Conservativo: tocca solo le risoluzioni riconosciute e lascia intatte le versioni con la stessa risoluzione. La pulizia sposta i file nel trash.": "Find clearly inferior video files (lower resolution) left beside the best version. The check uses the file name and technical data declared in it; it does not compare content or calculate hashes. Conservative: it only handles recognised resolutions and leaves versions at the same resolution untouched. Cleanup moves files to trash."
  "Inserisci più parole separate da virgole: vengono cercate in OR. Operazione irreversibile: usa prima Anteprima.": "Enter multiple words separated by commas: they are searched with OR. This operation is irreversible: use Preview first."
