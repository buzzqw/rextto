  "Intervallo tra i tentativi di reannounce dei torrent stalled, mantenuti fuori dalla coda attiva.": "Interval between reannounce attempts for stalled torrents, which remain outside the active queue."
  "Killswitch VPN: interfaccia usata per tutto il traffico BitTorrent in uscita (es. tun0, wg0).": "VPN killswitch: interface used for all outgoing BitTorrent traffic (e.g. tun0, wg0)."
  "Limite di seeding in minuti, usato solo se Seed massimo (giorni) è 0; utile per limiti inferiori a 24 ore.": "Seeding limit in minutes, used only when Maximum seed (days) is 0; useful for limits below 24 hours."
