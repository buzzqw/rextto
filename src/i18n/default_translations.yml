  # Acquisition tab
  "Acquisizione": "Acquisition"
  "Acquisizione automatica": "Automatic acquisition"
  "Attesa prima del download, protezione dagli episodi vecchi e pulizia periodica. Le regole di sanità (sottotitoli hardcoded e dimensione anomala) sono automatiche.": "Wait before downloading, protection from older episodes and periodic cleanup. Sanity rules (hardcoded subtitles and absurd sizes) are automatic."
  "Delay serie (minuti, 0 = nessuno)": "Series delay (minutes, 0 = none)"
  "Delay film (minuti, 0 = nessuno)": "Movie delay (minutes, 0 = none)"
  "Bypassa il delay sopra questo punteggio (0 = mai)": "Bypass the delay above this score (0 = never)"
  "Rextto non scarica mai un episodio più vecchio fuori dai buchi riconosciuti quando possiede già episodi successivi: è una regola fissa, non disattivabile. Un vero upgrade di qualità resta permesso, e gap-fill e azioni manuali passano sempre.": "Rextto never downloads an older episode outside a recognised gap while it already owns later ones: this is a fixed rule that cannot be disabled. A real quality upgrade is still allowed, and gap-fill and manual actions always pass."
  "Housekeeping periodico attivo": "Periodic housekeeping enabled"
  "Housekeeping — intervallo (ore)": "Housekeeping — interval (hours)"
  "Housekeeping — statistiche cicli di ricerca conservate": "Housekeeping — search-cycle statistics kept"
  "Housekeeping — visti nel feed (giorni, 0 = mai)": "Housekeeping — feed-seen entries (days, 0 = never)"
  "Housekeeping — storico download (giorni, 0 = conserva)": "Housekeeping — download history (days, 0 = keep)"
  "Housekeeping: cosa pulisce e cosa non tocca": "Housekeeping: what it cleans and what it does not touch"
  "Cicli di ricerca: conserva solo le statistiche di ogni ciclo (release analizzate, candidate, download avviati, gap riempiti ed errori). Con 200, quando arriva il 201° ciclo vengono eliminati solo i contatori del ciclo più vecchio, non la release.": "Search cycles: keeps only the statistics for each cycle (releases scanned, candidates, started downloads, filled gaps, and errors). With 200, when cycle 201 arrives, only the oldest cycle's counters are removed—not the release."
  "Visti nei feed: con 30 elimina le righe storiche dei feed oltre 30 giorni; con 0 non elimina nulla.": "Feed-seen entries: with 30, removes historical feed rows older than 30 days; with 0, removes nothing."
  "Storico download della sezione Scarico: con 90 elimina le righe dei torrent già rimossi oltre 90 giorni; con 0 conserva lo storico. Non riguarda l'Archivio.": "Download history in the Downloads section: with 90, removes rows for torrents already removed more than 90 days ago; with 0, keeps the history. It does not affect the Archive."
  "Automaticamente rimuove anche torrent in errore oltre 7 giorni, log dei gap oltre 30 giorni, backup di upgrade oltre 30 giorni e backoff delle sorgenti già scaduti.": "It also automatically removes torrents in error older than 7 days, gap logs older than 30 days, upgrade backups older than 30 days, and expired source backoffs."
  "Non cancella file della libreria, download completati o release dall'Archivio: la retention dell'Archivio è un'impostazione separata.": "It does not delete library files, completed downloads, or releases from the Archive: Archive retention is a separate setting."
  "Importa/esporta traduzioni interfaccia": "Import/export interface translations"
  "Questo pannello serve a fare una copia o una modifica avanzata delle traduzioni dell'interfaccia. Scegli una lingua e premi Esporta per caricare nell'editor le coppie chiave/valore salvate; modifica il testo YAML e premi Importa per aggiornare o aggiungere le traduzioni. Le chiavi non presenti nel file importato non vengono cancellate. Esempio: \"Testa porte\": \"Test ports\". Dopo l'importazione l'interfaccia si aggiorna automaticamente se hai importato la lingua attiva; altrimenti selezionala dal menu in alto.": "Use this panel to back up or advanced-edit interface translations. Choose a language and click Export to load the saved key/value pairs into the editor; edit the YAML and click Import to update or add translations. Keys missing from the imported file are not deleted. Example: \"Testa porte\": \"Test ports\". After importing, the interface updates automatically if you imported the active language; otherwise select it from the top menu."
  "Lingua delle traduzioni": "Translation language"
  "Carica nell'editor le traduzioni salvate per la lingua scelta": "Load the saved translations for the selected language into the editor"
  "Traduzioni esportate": "Translations exported"
  "Aggiorna o aggiunge le traduzioni della lingua scelta usando il testo YAML nell'editor; la lingua attiva si aggiorna automaticamente se coincide con quella scelta": "Update or add translations for the selected language using the YAML text in the editor; the active language updates automatically when it matches the selected language"
  "Traduzioni importate": "Translations imported"
  "Traduzioni importate; interfaccia aggiornata": "Translations imported; interface updated"
  "Traduzioni importate per": "Translations imported for"
  "seleziona questa lingua nel menu in alto per visualizzarle": "select this language from the top menu to view them"
  "Esporta YAML": "Export YAML"
  "Importa YAML": "Import YAML"
  "Incolla qui le traduzioni nel formato YAML chiave: valore": "Paste translations here in YAML key: value format"
  "Esegui housekeeping ora": "Run housekeeping now"
  "Azzera backoff sorgenti": "Reset source backoff"
  "Esegue subito pulizia tabelle e compattazione dei database": "Runs table cleanup and database compaction now"
  "Azzera i periodi di disattivazione di tutte le sorgenti": "Clears the disabled windows of every source"
  "Questa scheda controlla quando parte un download, il riempimento dei gap, la manutenzione dei database e il recupero delle informazioni tecniche dei file.": "This tab controls download timing, gap filling, database maintenance, and recovery of technical file information."
  "La protezione vale solo per episodi non pertinenti a un gap o a un upgrade. Le azioni manuali e il riempimento dei gap non vengono bloccati.": "This protection applies only to episodes unrelated to a gap or upgrade. Manual actions and gap filling are never blocked."
  "Esegue subito pulizia tabelle e compattazione dei database, senza attendere il prossimo intervallo automatico.": "Run table cleanup and database compaction immediately, without waiting for the next automatic interval."
  "Azzera i periodi di disattivazione di tutte le sorgenti e consente nuovi tentativi immediati.": "Clear the disabled windows for all sources and allow immediate new attempts."
  "Cartella locale che Rextto controlla periodicamente per nuovi file .torrent e .magnet.": "Local folder that Rextto periodically checks for new .torrent and .magnet files."
  "Controlla questa cartella ogni 15 secondi. Se disattivata, il percorso resta salvato ma non viene importato nulla.": "Check this folder every 15 seconds. When disabled, the path remains saved but nothing is imported."
  "Cerca anche nelle sottocartelle, non solo nella directory indicata.": "Also search subfolders, not only the selected directory."
  "Dopo l'importazione riuscita elimina il file sorgente. Se disattivata, il file viene rinominato con estensione .imported per evitare nuovi tentativi.": "Delete the source file after a successful import. When disabled, rename it with the .imported extension to prevent retries."
  "Rimuove questa cartella dall'elenco senza cancellare file dal disco.": "Remove this folder from the list without deleting files from disk."
  "Aggiunge una nuova cartella osservata; inserisci il percorso prima di salvarla.": "Add a new watched folder; enter its path before saving."
  "Salva tutti i percorsi e le relative opzioni. Il worker li applica al successivo controllo.": "Save all paths and their options. The worker applies them on its next check."
  "Azzera il backoff di questa sorgente e consente un nuovo tentativo immediato.": "Clear this source's backoff and allow an immediate retry."

  # Acquisition tooltips
  "Intervallo tra le ricerche automatiche di serie e film, in secondi (21600 = 6 ore). I fumetti seguono il proprio intervallo settimanale.": "Time between automatic series and movie searches, in seconds (21600 = 6 hours). Comics use their own weekly interval."
  "Ignora le release più vecchie di N giorni (0 = nessun limite).": "Ignore releases older than N days (0 = no limit)."
  "Attiva il riempimento dei buchi (episodi mancanti) dalle release disponibili.": "Enable filling recognised gaps (missing episodes) from available releases."
  "Numero massimo di gap da cercare per serie in un ciclo (0 = illimitato).": "Maximum gaps to search per series in one cycle (0 = unlimited)."
  "Ogni quante ore fare una ricerca live mirata sugli indexer per i gap.": "How many hours between targeted live indexer searches for gaps."
  "Numero massimo di ricerche live (deep) per ciclo.": "Maximum number of live deep searches per cycle."
  "Ritarda l'avvio dei download delle serie per questo numero di minuti dopo che una release è stata trovata. 0 avvia senza attesa; serve a lasciare arrivare versioni migliori.": "Delay series downloads by this many minutes after finding a release. 0 starts without waiting; a delay lets better versions arrive."
  "Ritarda l'avvio dei download dei film per questo numero di minuti dopo che una release è stata trovata. 0 avvia senza attesa.": "Delay movie downloads by this many minutes after finding a release. 0 starts without waiting."
  "Se una release raggiunge almeno questo punteggio, ignora il delay configurato. 0 disattiva il bypass e lascia attivo sempre il delay.": "When a release reaches at least this score, bypass the configured delay. 0 disables the bypass and always keeps the delay active."
  "Attiva la pulizia periodica dei dati tecnici e dello storico. Non cancella i file della libreria né le release dell'Archivio.": "Enable periodic cleanup of technical data and history. It does not delete library files or releases from the Archive."
  "Intervallo tra due housekeeping automatici, in ore. Esempio: 24 esegue la pulizia una volta al giorno; il comando manuale resta sempre disponibile.": "Time between automatic housekeeping runs, in hours. Example: 24 runs cleanup once a day; the manual command remains available."
  "Numero di statistiche dei cicli di ricerca da conservare. Ogni statistica conta release analizzate, candidate, download avviati, gap riempiti ed errori. Esempio: 200 conserva gli ultimi 200 cicli e, quando arriva il 201°, elimina solo i relativi contatori: non elimina release, torrent o file.": "Number of search-cycle statistics to keep. Each statistic counts releases scanned, candidates, started downloads, filled gaps, and errors. Example: 200 keeps the latest 200 cycles and, when cycle 201 arrives, removes only that cycle's counters: it does not delete releases, torrents, or files."
  "Elimina solo le righe storiche delle release già viste nei feed più vecchie di questo numero di giorni. Esempio: 30 pulisce i record dei feed oltre 30 giorni; 0 non applica questa pulizia.": "Only remove historical rows for releases already seen in feeds that are older than this many days. Example: 30 cleans feed records older than 30 days; 0 disables this cleanup."
  "Elimina dallo Storico download della sezione Scarico le righe dei torrent già rimossi più vecchie di questo numero di giorni, senza cancellare i file della libreria. Esempio: 90 rimuove solo le righe di download già rimossi oltre 90 giorni; 0 conserva lo storico.": "Remove rows from Download history in the Downloads section for torrents already removed more than this many days ago, without deleting library files. Example: 90 removes only download rows already removed more than 90 days ago; 0 keeps the history."
  "Analizza periodicamente con ffprobe i file già presenti che non hanno ancora MediaInfo. Non modifica né sposta i file.": "Periodically probe existing files without MediaInfo using ffprobe. Files are not modified or moved."
  "Minuti tra due passaggi del backfill MediaInfo. Intervalli più bassi completano prima l'analisi ma usano più disco/CPU.": "Minutes between MediaInfo backfill runs. Lower intervals finish sooner but use more disk/CPU."
  "Numero massimo di file analizzati in ogni passaggio MediaInfo. Valori più alti accelerano il recupero ma aumentano il carico temporaneo.": "Maximum files analysed in each MediaInfo run. Higher values recover data faster but increase temporary load."

