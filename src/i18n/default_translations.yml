  "Download conclusi negli ultimi 30 giorni. Il badge NAS indica che il file è stato archiviato (percorso in libreria/NAS); il tag è la regola di cartella applicata.": "Downloads completed in the last 30 days. The NAS badge means the file was archived (in the library/NAS path); the tag is the applied folder rule."
