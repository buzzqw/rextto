  "Elimina dal database le release rilevate nei feed di film e serie con found_at più vecchio del numero di giorni indicato. Non elimina file, torrent, serie o film monitorati. Il pulsante esegue anche la pulizia standard: conserva gli ultimi 50 cicli e rimuove gli errori torrent più vecchi di 7 giorni.": "Delete from the database movie and series releases found in feeds whose found_at is older than the specified number of days. It does not delete files, torrents, monitored series or movies. The button also runs standard cleanup: it keeps the last 50 cycles and removes torrent errors older than 7 days."
