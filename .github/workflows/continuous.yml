name: Continuous Linux build

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: continuous-linux-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential binutils mold cmake pkg-config libssl-dev \
            libtorrent-rasterbar-dev curl

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo-leptos
        run: cargo install cargo-leptos --locked

      - name: Build daemon and web UI
        run: |
          cargo build --release --locked
          cargo leptos --manifest-path ui/Cargo.toml build --release --frontend-only

      - name: Package continuous build
        run: |
          scripts/package-linux.sh \
            --binary target/release/rexttod \
            --ui ui/target/site \
            --output rextto-linux-x86_64.tar.gz \
            --label "continuous-${GITHUB_SHA::12}"

      - name: Publish continuous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete continuous --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create continuous \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Rextto continuous build" \
            --notes "Automatic build from commit $GITHUB_SHA on main." \
            --prerelease \
            rextto-linux-x86_64.tar.gz \
            rextto-linux-x86_64.tar.gz.sha256
